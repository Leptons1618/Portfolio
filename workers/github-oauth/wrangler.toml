name = "portfolio-github-oauth"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# The site calls the workers.dev URL directly, so that route stays on. Preview
# URLs do not: every deployed version would get its own public hostname, and
# this Worker holds a credential. One address is enough surface.
workers_dev = true
preview_urls = false

[vars]
# Public values. GITHUB_CLIENT_ID is the GitHub App's client ID (`Iv23…`) and
# must equal PUBLIC_GITHUB_CLIENT_ID in the site build. Every entry in
# ALLOWED_ORIGINS must be an origin the admin is actually served from —
# including the dev origin, which is also a registered callback on the App.
GITHUB_CLIENT_ID = "Iv23lilJmWXy72Ei3TdP"
ALLOWED_ORIGINS = "https://anishgiri.dev,http://localhost:4321"

# GITHUB_CLIENT_SECRET is NOT set here. It is a secret:
#   wrangler secret put GITHUB_CLIENT_SECRET
# It must be the *App's* client secret. An OAuth App secret left over from the
# previous setup will exchange into a token the App's permissions do not back.
