name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty unless the repo sets SITE_URL, and empty is the supported state:
      # `astro.config.mjs` falls back to the live origin, which
      # `scripts/check-content.mjs` holds equal to public/CNAME. A literal
      # origin here would silently outrank all of that at build time — which is
      # how every canonical URL and OG tag in production ended up pointing at
      # github.io while the site served from anishgiri.dev.
      SITE_URL: ${{ vars.SITE_URL }}
      # Admin GitHub sign-in. All three are public values, so they are
      # repository *variables*, not secrets — the only secret is
      # GITHUB_CLIENT_SECRET, and it lives in the Cloudflare Worker. Actions
      # refuses variable names starting with GITHUB_, hence the shorter names.
      # Leave the first two unset and the admin screens fall back to
      # export-only; the slug is optional in every case and only builds a link.
      PUBLIC_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      PUBLIC_GITHUB_OAUTH_WORKER: ${{ vars.OAUTH_WORKER_URL }}
      PUBLIC_GITHUB_APP_SLUG: ${{ vars.OAUTH_APP_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.18+ runs TypeScript directly by stripping types, which is how
          # `scripts/test-frontmatter.mjs` imports `src/lib/frontmatter.ts`
          # without a build step. On 20 that import is a hard error.
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Add CNAME for custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
