name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No `pages: write` or `id-token: write` any more: the site is not published to
# GitHub Pages. All this job needs from GitHub is the ability to read the repo.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Empty unless the repo sets SITE_URL, and empty is the supported state:
      # `astro.config.mjs` falls back to the live origin, which
      # `scripts/check-content.mjs` holds equal to public/CNAME. A literal
      # origin here would silently outrank all of that at build time — which is
      # how every canonical URL and OG tag in production ended up pointing at
      # github.io while the site served from anishgiri.dev.
      SITE_URL: ${{ vars.SITE_URL }}
      # Admin GitHub sign-in. All three are public values, so they are
      # repository *variables*, not secrets — the only secret GitHub-side is
      # GITHUB_CLIENT_SECRET, and it lives in the token-exchange Worker.
      # Actions refuses variable names starting with GITHUB_, hence the shorter
      # names. Leave the first two unset and the admin screens stay ungated and
      # read-only; the slug is optional and only builds a link.
      PUBLIC_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      PUBLIC_GITHUB_OAUTH_WORKER: ${{ vars.OAUTH_WORKER_URL }}
      PUBLIC_GITHUB_APP_SLUG: ${{ vars.OAUTH_APP_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # Schema first, and separately from the deploy. A migration that adds a
      # column the new code reads has to be applied before that code serves a
      # request; the other order is a live site querying a column that does not
      # exist yet. `migrations apply` is idempotent — it runs what the
      # d1_migrations table says has not run.
      #
      # It is deliberately not `--yes`-forced past a failure: if a migration
      # cannot be applied, deploying the code that depends on it is worse than
      # not deploying at all, so this step failing stops the job.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply portfolio-content --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
