name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || 'https://leptons1618.github.io' }}
      # Admin GitHub sign-in. Both are public values, so they are repository
      # *variables*, not secrets — the only secret is GITHUB_CLIENT_SECRET, and
      # it lives in the Cloudflare Worker. Actions refuses variable names
      # starting with GITHUB_, hence the shorter names here.
      # Leave them unset and the admin screens fall back to export-only.
      PUBLIC_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      PUBLIC_GITHUB_OAUTH_WORKER: ${{ vars.OAUTH_WORKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Add CNAME for custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
