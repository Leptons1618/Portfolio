name: Check

# Fast feedback before code reaches `main`. Deploys are gated separately by the
# typecheck step in deploy.yml, so `main` pushes are deliberately excluded here
# rather than running the same check twice.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must match deploy.yml: `npm run check` imports a `.ts` module from a
          # plain Node script, which needs 22.18+ type stripping.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run check` runs check-content.mjs, which refuses an ungenerated
      # wrangler.jsonc under CI (see its check 5): without a real database_id
      # the build would only fail later, with something far less obvious. This
      # is the same generate step deploy.yml runs before deploying.
      - name: Generate wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run config

      - name: Typecheck
        run: npm run check
